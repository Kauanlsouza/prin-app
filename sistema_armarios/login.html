<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.jpg" type="image/jpeg"><title>Entrar | Sistema de Armários</title>
<style>
:root{color-scheme:light dark;--fundo:#081a2d;--cartao:rgba(255,255,255,.96);--texto:#172033;--suave:#607086;--marca:#d66d3d;--marca-escura:#ae4d24;--borda:#dbe3ed}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;font-family:"Segoe UI",Arial,sans-serif;color:var(--texto);background:radial-gradient(circle at 15% 15%,#267e86 0,transparent 30%),radial-gradient(circle at 85% 85%,#d66d3d80 0,transparent 27%),linear-gradient(135deg,#081a2d,#123f68)}.login{width:min(100%,460px);padding:36px;border:1px solid #ffffff55;border-radius:28px;background:var(--cartao);box-shadow:0 28px 70px #0007}.marca{display:inline-flex;padding:7px 10px;border-radius:999px;background:#fff0e7;color:var(--marca-escura);font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:16px 0 8px;font-size:clamp(1.7rem,5vw,2.15rem);letter-spacing:-.035em}p{margin:0 0 24px;color:var(--suave);line-height:1.5}.abas{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;margin-bottom:20px;border-radius:13px;background:#edf2f7}.aba{margin:0;padding:10px;border:0;border-radius:9px;background:transparent;color:#536274;font:700 .88rem inherit;cursor:pointer}.aba.ativa{background:#fff;color:var(--texto);box-shadow:0 2px 7px #20364b1a}label{display:block;margin:15px 0 6px;font-weight:700;font-size:.9rem}.campo-senha{position:relative}.campo-senha input{padding-right:48px}input{width:100%;padding:13px;border:1px solid var(--borda);border-radius:11px;background:#fff;color:var(--texto);font:inherit}input:focus{outline:3px solid #f9c8ae;border-color:var(--marca)}.olho{position:absolute;right:6px;top:50%;width:36px;height:36px;margin:0;padding:0;transform:translateY(-50%);border:0;border-radius:9px;background:transparent;color:var(--suave);cursor:pointer;font-size:18px}.olho:hover{background:#edf2f7;color:var(--marca-escura)}.acao{width:100%;margin-top:24px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--marca),#e68751);color:#fff;cursor:pointer;font:800 1rem inherit;box-shadow:0 8px 18px #d66d3d44}.acao:hover{background:var(--marca-escura)}button:disabled{opacity:.65;cursor:wait}.dica{margin:15px 0 0;padding:12px;border-left:3px solid #74a8c6;border-radius:8px;background:#edf7fc;color:#31546a;font-size:.84rem}#erro{min-height:1.3em;margin:16px 0 0;color:#b42318;font-size:.9rem}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--cartao:#122131;--texto:#edf4fb;--suave:#b6c5d3;--borda:#40556a}.abas{background:#0c1723}.aba.ativa{background:#213548;color:#fff}input{background:#0d1925;color:#fff}.olho:hover{background:#213548;color:#fff}.marca{background:#432a20;color:#ffd3b7}.dica{background:#132d3d;color:#c6e4f4}}
</style></head><body><main class="login"><div class="marca">Sistema de Armários</div><h1 id="titulo">Entrar no sistema</h1><p id="descricao">Acesse sua conta para registrar as movimentações do seu turno.</p><div id="abas" class="abas"><button class="aba ativa" type="button" data-modo="entrar">Entrar</button><button class="aba" type="button" data-modo="cadastrar">Cadastrar</button></div><form id="form-login"><div id="campo-nome" hidden><label for="nome">Nome completo</label><input id="nome" autocomplete="name"></div><label for="usuario">Usuário</label><input id="usuario" autocomplete="username" required autofocus><label for="senha">Senha</label><div class="campo-senha"><input id="senha" type="password" autocomplete="current-password" required><button class="olho" type="button" data-senha="senha" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div><div id="campo-confirmacao" hidden><label for="senha-confirmacao">Confirmar senha</label><div class="campo-senha"><input id="senha-confirmacao" type="password" autocomplete="new-password"><button class="olho" type="button" data-senha="senha-confirmacao" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div></div><div id="campo-senha-adm" hidden><label for="senha-adm">Senha secreta de cadastro</label><div class="campo-senha"><input id="senha-adm" type="password" autocomplete="off"><button class="olho" type="button" data-senha="senha-adm" aria-label="Mostrar senha secreta" title="Mostrar senha">👁</button></div><div class="dica">Informe a senha secreta para liberar o cadastro.</div></div><button id="entrar" class="acao" type="submit">Entrar</button><div id="erro" role="alert"></div></form></main>
<script>
let modo="entrar",primeiroAcesso=false;const $=id=>document.getElementById(id);function atualizarModo(novoModo){modo=novoModo;const cadastro=modo==="cadastrar";document.querySelectorAll(".aba").forEach(botao=>botao.classList.toggle("ativa",botao.dataset.modo===modo));$("campo-nome").hidden=!cadastro;$("nome").required=cadastro;$("campo-confirmacao").hidden=!cadastro;$("senha-confirmacao").required=cadastro;$("campo-senha-adm").hidden=!cadastro;$("senha-adm").required=cadastro;$("titulo").textContent=cadastro?"Criar conta de operador":"Entrar no sistema";$("descricao").textContent=cadastro?"Use a senha secreta para liberar seu cadastro.":"Acesse sua conta para registrar as movimentações do seu turno.";$("entrar").textContent=cadastro?"Criar minha conta":"Entrar";$("erro").textContent=""}async function verificarPrimeiroAcesso(){try{const resposta=await fetch("/primeiro-acesso"),dados=await resposta.json();primeiroAcesso=!dados.tem_funcionarios;if(primeiroAcesso){$("abas").hidden=true;atualizarModo("cadastrar");$("titulo").textContent="Configure o primeiro acesso";$("descricao").textContent="Crie a primeira conta administradora do sistema.";$("campo-senha-adm").hidden=true;$("senha-adm").required=false}}catch(_){}}document.querySelectorAll(".aba").forEach(botao=>botao.addEventListener("click",()=>atualizarModo(botao.dataset.modo)));document.querySelectorAll(".olho").forEach(botao=>botao.addEventListener("click",()=>{const campo=$(botao.dataset.senha),mostrar=campo.type==="password";campo.type=mostrar?"text":"password";botao.textContent=mostrar?"🙈":"👁";botao.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha");botao.title=botao.getAttribute("aria-label")}));verificarPrimeiroAcesso();$("form-login").addEventListener("submit",async event=>{event.preventDefault();const botao=$("entrar"),erro=$("erro");erro.textContent="";botao.disabled=true;try{const rota=primeiroAcesso?"/primeiro-acesso":(modo==="cadastrar"?"/cadastro":"/login");if(rota!=="/login"&&$("senha").value!==$("senha-confirmacao").value)throw new Error("As senhas não coincidem.");const dadosEnvio={nome:$("nome").value,usuario:$("usuario").value,senha:$("senha").value,senha_confirmacao:$("senha-confirmacao").value,senha_adm:$("senha-adm").value};const resposta=await fetch(rota,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dadosEnvio)}),dados=await resposta.json();if(!resposta.ok||!dados.ok)throw new Error(dados.mensagem||"Não foi possível concluir a ação.");if(rota==="/login"){window.location.assign("/");return}if(primeiroAcesso){primeiroAcesso=false;$("abas").hidden=false;atualizarModo("entrar")}else atualizarModo("entrar");$("descricao").textContent=dados.mensagem;$("senha").value="";$("senha-confirmacao").value="";$("senha-adm").value="";$("usuario").focus()}catch(ex){erro.textContent=ex.message}finally{botao.disabled=false}});
</script></body></html>
